[project]
name = "tinder-match-engine"
version = "0.1.0"
description = "Multimodal preference-learning and autonomous matching engine."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pip>=26.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinder_match_engine"]


